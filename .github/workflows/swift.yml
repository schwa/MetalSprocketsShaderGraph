# Build and test Swift package
name: Swift

on:
  push:
  pull_request:

jobs:
  swift-build-26:
    env:
      XCODE_VERSION: "26.0"
    runs-on: macos-26
    steps:
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download MetalToolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Trust plugins
        run: defaults write com.apple.dt.Xcode IDESkipPackagePluginFingerprintValidation -bool YES

      - name: Build (macOS)
        run: swift build -v -Xswiftc -warnings-as-errors

      - name: Test (macOS)
        run: swift test -v -Xswiftc -warnings-as-errors

      - name: Create iOS destination
        run: |
          cat > .ios-destination.json << 'EOF'
          {
              "version": 1,
              "sdk": "/Applications/Xcode.app/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs/iPhoneOS.sdk",
              "toolchain-bin-dir": "/Applications/Xcode.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/bin",
              "target": "arm64-apple-ios26.0",
              "extra-cc-flags": [],
              "extra-swiftc-flags": [],
              "extra-cpp-flags": []
          }
          EOF

      - name: Build (iOS)
        run: swift build -v -Xswiftc -warnings-as-errors --destination .ios-destination.json

      - name: Build Demo App (macOS)
        run: |
          xcodebuild build \
            -project Demo/MetalSprocketsShaderGraphDemo.xcodeproj \
            -scheme MetalSprocketsShaderGraphDemo \
            -destination 'platform=macOS' \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO
